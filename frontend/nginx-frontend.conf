# nginx config for the frontend container in production.
# Serves built Vite static assets and reverse-proxies /api/* to the backend.
# Caddy handles TLS termination and proxies everything to this container.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests -> backend (FastAPI + uvicorn)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so file downloads stream directly
        proxy_buffering off;
        proxy_request_buffering off;

        # Allow large file downloads
        proxy_max_temp_file_size 0;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}