# nginx config for the frontend container in production.
# Serves the built Vite static assets.
# Caddy handles /api routing and TLS termination.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}