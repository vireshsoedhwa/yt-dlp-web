# Base services — shared between dev and prod.
# Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#       or: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: ytdlp-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytdlp-backend
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - REDIS_URL=redis://redis:6379/0
      - PURGE_MAX_AGE_HOURS=3
      - PURGE_INTERVAL_SECONDS=3600
      - JOB_CARD_TTL_HOURS=2
      - SERVING_FLAG_TTL_SECONDS=3600
      - SESSION_DIR=/app/downloads/.session
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytdlp-worker
    command: ["python", "-m", "app.worker"]
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - REDIS_URL=redis://redis:6379/0
      - PURGE_MAX_AGE_HOURS=3
      - PURGE_INTERVAL_SECONDS=3600
      - JOB_CARD_TTL_HOURS=2
      - SERVING_FLAG_TTL_SECONDS=3600
      - SESSION_DIR=/app/downloads/.session
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped